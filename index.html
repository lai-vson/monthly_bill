<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Split</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --card: #fff; --fg: #1d1d1f; --muted: #6b6f76; --accent: #25d366; --border: #d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121417; --card: #1c1f24; --fg: #eceef1; --muted: #9aa0a8; --border: #33373e; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  main { width: 100%; max-width: 560px; margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  h1 { font-size: 1.4rem; margin: 4px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .version { font-size: .75rem; font-weight: 400; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 10px; flex: 1 1 0; min-width: 0; }
  /* 16px stops iOS Safari from zooming in when a field is tapped. */
  input, select, textarea { display: block; width: 100%; max-width: 100%; min-width: 0; margin-top: 4px; padding: 9px 10px;
    font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  /* iOS gives date/month inputs a fixed intrinsic width that overflows narrow cards. */
  input[type="date"], input[type="month"] { -webkit-appearance: none; appearance: none; min-height: 44px; text-align: left;
    -webkit-min-logical-width: calc(100% - 20px); }
  input::-webkit-date-and-time-value { text-align: left; min-width: 0; }
  /* Rows with native date/month pickers don't fit side by side on most phones, so stack them. */
  @media (max-width: 430px) { .row.dates { flex-direction: column; gap: 0; } }
  textarea { font-family: inherit; line-height: 1.4; resize: none; overflow: hidden; field-sizing: content; min-height: 8em; }
  .row { display: flex; gap: 10px; }
  .upload { border: 2px dashed var(--border); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; color: var(--fg); }
  .upload input { display: none; }
  .status { font-size: .85rem; color: var(--muted); margin: 0 0 10px; min-height: 1.2em; }
  .status.error { color: #e5484d; }
  .buttons { display: flex; gap: 10px; margin-top: 10px; }
  button { flex: 1; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 10px; cursor: pointer; }
  #share { background: var(--accent); color: #fff; }
  #copy { background: var(--border); color: var(--fg); }
  .note { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Monthly bill split <small class="version">v4</small></h1>

  <section class="card" data-bill="utility">
    <h2>Utility (SP Group)</h2>
    <label class="upload">📄 Upload bill (PDF or screenshot)<input type="file" accept="application/pdf,image/*"></label>
    <p class="status"></p>
    <label>Amount ($)<input type="number" step="0.01" min="0" inputmode="decimal" name="amount"></label>
    <div class="row dates">
      <label>From<input type="date" name="from"></label>
      <label>To<input type="date" name="to"></label>
    </div>
  </section>

  <section class="card" data-bill="internet">
    <h2>Internet (StarHub)</h2>
    <label class="upload">📄 Upload bill (PDF or screenshot)<input type="file" accept="application/pdf,image/*"></label>
    <p class="status"></p>
    <label>Amount ($)<input type="number" step="0.01" min="0" inputmode="decimal" name="amount"></label>
    <div class="row dates">
      <label>From<input type="date" name="from"></label>
      <label>To<input type="date" name="to"></label>
    </div>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <div class="row dates">
      <label>Month<input type="month" id="month"></label>
      <label>People<input type="number" id="people" min="1" step="1" value="4" inputmode="numeric"></label>
    </div>
    <label>Round per person to
      <select id="rounding">
        <option value="2">2 decimals ($53.88)</option>
        <option value="1">1 decimal ($53.9)</option>
        <option value="0">Whole dollar ($54)</option>
      </select>
    </label>
    <label>Closing note<input type="text" id="note" value="Please PayNow me when you can. Thanks all! 🙏"></label>
  </section>

  <section class="card">
    <h2>Message</h2>
    <textarea id="message" rows="8" spellcheck="false"></textarea>
    <div class="buttons">
      <button id="share" type="button">Send to WhatsApp</button>
      <button id="copy" type="button">Copy</button>
    </div>
    <p class="note">Bills are read on this device only and are not uploaded anywhere. Always check the detected amounts and dates.</p>
  </section>
</main>

<script type="module">
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
const PDFJS_WORKER_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
const MONTH_INDEX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const SEPARATOR = '━━━━━━━━━━━━━━';

// Labels tried in order when looking for the bill total.
const AMOUNT_LABELS = [
  /total\s+amount\s+(?:due|payable)/,
  /amount\s+(?:due|payable)/,
  /total\s+current\s+charges/,
  /current\s+(?:month'?s?\s+)?charges/,
  /total\s+due/,
  /total\s+charges/,
];

const DATE = String.raw`\d{1,2}[\s-]+[A-Za-z]{3,9}\.?(?:[\s,-]+\d{2,4})?|\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}`;
const RANGE_RE = new RegExp(String.raw`(${DATE})\s*(?:-|–|—|to)\s*(${DATE})`, 'gi');

const $ = (sel) => document.querySelector(sel);
const pad = (n) => String(n).padStart(2, '0');

// ---------- parsing ----------

function parseDate(raw, fallbackYear) {
  const s = raw.trim();
  let day, month, year;
  let m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3,9})\.?(?:[\s,-]+(\d{2,4}))?$/);
  if (m) {
    month = MONTH_INDEX[m[2].slice(0, 3).toLowerCase()];
    day = Number(m[1]);
    year = m[3];
  } else if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/))) {
    day = Number(m[1]);
    month = Number(m[2]) - 1; // Singapore bills use day/month/year
    year = m[3];
  } else {
    return null;
  }
  year = year ? (Number(year) < 100 ? 2000 + Number(year) : Number(year)) : fallbackYear;
  if (month === undefined || !year || day < 1 || day > 31 || month < 0 || month > 11) return null;
  return `${year}-${pad(month + 1)}-${pad(day)}`;
}

function findPeriod(text) {
  for (const m of text.matchAll(RANGE_RE)) {
    const to = parseDate(m[2]);
    if (!to) continue;
    const toYear = Number(to.slice(0, 4));
    let from = parseDate(m[1], toYear);
    if (!from) continue;
    if (from > to) from = `${toYear - 1}${from.slice(4)}`; // e.g. "15 Dec - 14 Jan 2027"
    return { from, to };
  }
  return null;
}

const toNumber = (s) => Number.parseFloat(s.replace(/,/g, ''));

function findAmount(text) {
  for (const label of AMOUNT_LABELS) {
    const re = new RegExp(label.source + String.raw`[^\d]{0,40}?(?:S\$|\$)?\s*([\d,]+\.\d{2})`, 'i');
    const m = text.match(re);
    if (m) return toNumber(m[1]);
  }
  // Fallback: the largest dollar figure on the bill.
  const all = [...text.matchAll(/\$\s*([\d,]+\.\d{2})/g)].map((m) => toNumber(m[1]));
  return all.length ? Math.max(...all) : null;
}

// ---------- text extraction ----------

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`Could not load ${src}`));
    document.head.append(el);
  });
}

async function pdfText(file) {
  const pdfjs = await import(PDFJS_URL);
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
  const data = new Uint8Array(await file.arrayBuffer());
  let doc;
  try {
    doc = await pdfjs.getDocument({ data: data.slice() }).promise;
  } catch (err) {
    if (err.name !== 'PasswordException') throw err;
    const password = prompt('This PDF is password-protected. Enter its password:');
    if (!password) throw new Error('No password entered');
    doc = await pdfjs.getDocument({ data, password }).promise;
  }
  let text = '';
  for (let i = 1; i <= doc.numPages; i++) {
    const content = await (await doc.getPage(i)).getTextContent();
    text += content.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n';
  }
  return text;
}

async function imageText(file, onProgress) {
  if (!window.Tesseract) await loadScript(TESSERACT_URL);
  const { data } = await window.Tesseract.recognize(file, 'eng', {
    logger: (m) => m.status === 'recognizing text' && onProgress(Math.round(m.progress * 100)),
  });
  return data.text;
}

// ---------- message ----------

function roundTo(value, dp) {
  const f = 10 ** dp;
  return Math.round((value + Number.EPSILON) * f) / f;
}

function fmtDate(iso) {
  if (!iso) return '?';
  const [y, m, d] = iso.split('-').map(Number);
  return `${pad(d)} ${MONTHS[m - 1]} ${String(y).slice(-2)}`;
}

// "12 Sept – 13 Oct 2026", or with both years when the period crosses a year.
function fmtRange(from, to) {
  if (!from || !to) return `${fmtDate(from)} – ${fmtDate(to)}`;
  const [fy, fm, fd] = from.split('-').map(Number);
  const [ty, tm, td] = to.split('-').map(Number);
  const start = fy === ty ? `${pad(fd)} ${MONTHS[fm - 1]}` : `${pad(fd)} ${MONTHS[fm - 1]} ${fy}`;
  return `${start} – ${pad(td)} ${MONTHS[tm - 1]} ${ty}`;
}

function fmtMonth(value) {
  if (!value) return '?';
  const [y, m] = value.split('-').map(Number);
  return `${MONTHS[m - 1]} ${y}`;
}

function readBill(name) {
  const card = $(`[data-bill="${name}"]`);
  const amount = Number.parseFloat(card.querySelector('[name="amount"]').value);
  return {
    amount: Number.isFinite(amount) ? amount : null,
    from: card.querySelector('[name="from"]').value,
    to: card.querySelector('[name="to"]').value,
  };
}

function buildMessage() {
  const people = Math.max(1, Number.parseInt($('#people').value, 10) || 1);
  const dp = Number($('#rounding').value);
  const utility = readBill('utility');
  const internet = readBill('internet');

  const share = (bill) => (bill.amount === null ? null : roundTo(bill.amount / people, dp));
  const perUtility = share(utility);
  const perInternet = share(internet);
  const total = perUtility === null || perInternet === null ? '?' : roundTo(perUtility + perInternet, dp).toFixed(dp);

  // WhatsApp renders *text* as bold.
  const section = (icon, title, bill, per) => [
    `${icon} *${title}*`,
    `📅 ${fmtRange(bill.from, bill.to)}`,
    `💵 $${bill.amount === null ? '?' : bill.amount.toFixed(2)} ÷ ${people} = *$${per === null ? '?' : per.toFixed(dp)}* each`,
  ];
  const note = $('#note').value.trim();

  return [
    `🧾 *Household bills – ${fmtMonth($('#month').value)}*`,
    '',
    ...section('⚡', 'Utilities (SP Group)', utility, perUtility),
    '',
    ...section('🌐', 'Internet (StarHub)', internet, perInternet),
    '',
    SEPARATOR,
    `💰 *Total per person: $${total}*`,
    SEPARATOR,
    ...(note ? ['', note] : []),
  ].join('\n');
}

// Grow the message box to fit its text (for browsers without CSS field-sizing).
function autosize() {
  const box = $('#message');
  box.style.height = 'auto';
  box.style.height = `${box.scrollHeight + 2}px`;
}

const render = () => { $('#message').value = buildMessage(); autosize(); };

// ---------- wiring ----------

let monthTouched = false;

async function handleUpload(card, file) {
  const status = card.querySelector('.status');
  status.classList.remove('error');
  status.textContent = `Reading ${file.name}…`;
  try {
    const text = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
      ? await pdfText(file)
      : await imageText(file, (p) => { status.textContent = `Reading screenshot… ${p}%`; });

    const amount = findAmount(text);
    const period = findPeriod(text);
    if (amount !== null) card.querySelector('[name="amount"]').value = amount.toFixed(2);
    if (period) {
      card.querySelector('[name="from"]').value = period.from;
      card.querySelector('[name="to"]').value = period.to;
      if (card.dataset.bill === 'utility' && !monthTouched) $('#month').value = period.to.slice(0, 7);
    }
    const missing = [amount === null && 'amount', !period && 'billing period'].filter(Boolean);
    status.textContent = missing.length
      ? `Couldn't find the ${missing.join(' or ')}. Please fill it in below.`
      : 'Detected. Please check the values below.';
    if (missing.length) status.classList.add('error');
  } catch (err) {
    console.error(err);
    status.classList.add('error');
    status.textContent = `Could not read the file (${err.message}). Enter the values manually.`;
  }
  render();
}

document.querySelectorAll('[data-bill]').forEach((card) => {
  card.querySelector('input[type="file"]').addEventListener('change', (e) => {
    const [file] = e.target.files;
    if (file) handleUpload(card, file);
    e.target.value = '';
  });
});

// Saved settings are optional: some browsers block storage (private mode, locally opened files).
const storage = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* not saved */ } },
};

for (const key of ['people', 'rounding', 'note']) {
  const saved = storage.get(`billsplit.${key}`);
  if (saved !== null) $(`#${key}`).value = saved; // '' is valid: a cleared closing note
  $(`#${key}`).addEventListener('change', (e) => storage.set(`billsplit.${key}`, e.target.value));
}

$('#month').addEventListener('input', () => { monthTouched = true; });
// Local date, not toISOString(): UTC would show last month before 8am on the 1st in Singapore.
const today = new Date();
$('#month').value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}`;
document.querySelectorAll('main input:not([type="file"]), main select').forEach((el) => el.addEventListener('input', render));
$('#message').addEventListener('input', autosize);
window.addEventListener('resize', autosize);

$('#share').addEventListener('click', () => {
  window.open(`https://wa.me/?text=${encodeURIComponent($('#message').value)}`, '_blank', 'noopener');
});

$('#copy').addEventListener('click', async () => {
  const text = $('#message').value;
  let copied = true;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Clipboard API is blocked inside some iframes (e.g. Apps Script web apps).
    $('#message').select();
    copied = document.execCommand('copy');
  }
  $('#copy').textContent = copied ? 'Copied!' : 'Select & copy manually';
  setTimeout(() => { $('#copy').textContent = 'Copy'; }, 1500);
});

render();

// Exposed for quick checks from the browser console.
window.billSplit = { findAmount, findPeriod };
</script>
</body>
</html>
